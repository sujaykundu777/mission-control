version: '3.8'

services:
  web:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: mission-control-os-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true

    restart: unless-stopped
     # Set environment variables based on the .env file
    env_file:
      - .env
    volumes:
      - ./client:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:

# Usage:
# Production: docker-compose up --build
# Development: Uncomment volumes above and use docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
